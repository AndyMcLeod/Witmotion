  <circle cx="16" cy="16" r="11.2" fill="none" stroke="#04080d" stroke-width="0.4"/>
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M8.6 16H13.2V17.4M23.4 16H18.8V17.4" stroke="#04080d" stroke-width="3"/>

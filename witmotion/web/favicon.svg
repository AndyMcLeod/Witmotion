  <rect x="1.3" y="1.3" width="29.4" height="29.4" rx="6.4" fill="url(#tile)" stroke="#2c4258" stroke-width="0.6"/>
  <circle cx="16" cy="16" r="12.6" fill="#091019" stroke="#4e6c8a" stroke-width="0.5"/>
